  note: >-
    Submitted via apis.io/add on 2026-08-20 (twice, as "HostDeFi" and "HostDeFi Token Risk API" —
    one provider, two records at the gate). The submitted APIs.json URL,
    https://hostdefi.com/apis.json, returns 404 against a control that also 404s, so the 404 is
    real; that is a bad pointer in the submission, not an absent surface.
    NO API-CATALOG IS RECORDED, DELIBERATELY. https://hostdefi.com/.well-known/api-catalog
    returns HTTP 200, but the body is the site's HTML homepage, not a linkset. Recording it as an
    APICatalog would hand HostDeFi credit for a discovery document it does not serve. The path
    answering 200 is not the same as the artifact existing.
    The x402 surface was verified live. GET /api/v1/x402/authority/solana/{mint} without a payment
    header returns HTTP 402 with x402Version 1 and two `accepts` entries — USDC on Solana and on
    Base, maxAmountRequired 5000, 60-second timeout, with a named feePayer. The saved challenge in
    finops/ is that response verbatim. The REST API was probed at /api/v1/health and returned 200.
    One thing for the provider rather than for us: the published contract lists a second server,
    https://awake-integrity-production-faa0.up.railway.app, which also answers /v1/health with 200.
    That looks like a staging backend reachable from a production specification.
