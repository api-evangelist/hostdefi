aid: hostdefi
name: HostDeFi
description: >-
  HostDeFi is a non-custodial Solana token-risk service that scans a mint before a purchase —
  mint and freeze authority state, liquidity depth and lock status, holder concentration,
  dangerous Token-2022 extensions, sell simulation and contract flags. The public contract is an
  OpenAPI 3.1 document of 26 operations served from hostdefi.com/api with API-key authentication.
  HostDeFi also exposes an x402 machine-payment surface: an authority quick-check endpoint that
  returns HTTP 402 with a signed payment challenge, priced in USDC and payable on either Solana
  or Base, so an agent can buy a single check without an account.
