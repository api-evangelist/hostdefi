method: derived
source: openapi/_original/hostdefi-openapi.json + https://hostdefi.com/docs/api/ (status-code table)
format: json-envelope
envelope: >-
  Errors are a plain JSON body with ok:false and an error string, not RFC 9457 problem+json.
  Error responses carry Cache-Control no-store. On x402 lanes, error responses explicitly state
  "nothing was charged" — server errors are never charged, and 402 bodies carry the payment offer.
problems:
- status: 400
  title: Missing or invalid input
  detail: Missing/unrecognized input, bad params, or a chain that is not enabled. On x402 lanes nothing is charged.
- status: 401
  title: Invalid or expired API key
  detail: The x-api-key header was present but not valid or past its expiry.
- status: 402
  title: Payment required (x402) or paid feature
  detail: >-
    On /v1/x402/* the body carries the x402 v1 accepts array (and the v2 PAYMENT-REQUIRED header) —
    pay one offer and retry with X-PAYMENT. On the keyed lane, batch without a key answers 402 as a
    paid-feature signal.
- status: 403
  title: Plan lacks this feature
  detail: A keyed plan without batch access (Builder) calling the batch endpoint.
- status: 404
  title: Token / data not resolvable
  detail: >-
    Could not resolve that token, no data for that input, not in the latest crawl, or an untracked
    prediction market. On x402 lanes an empty answer is an uncharged 404, never a paid empty result.
- status: 409
  title: Payment signature already redeemed
  detail: POST /v1/keys with a SOL transaction signature that was already used to claim a key.
- status: 429
  title: Rate limit or quota reached
  detail: >-
    Keyless fair-use (100/day/IP), plan quota, or the per-key burst ceiling (~5 req/s). The body says
    which and includes a reset time, plus an x402 block showing the pay-per-call way to continue.
- status: 500
  title: Server error
  detail: Internal failure; on x402 lanes nothing is charged. Key issuance failures are not charged.
- status: 503
  title: Upstream unavailable
  detail: RPC unreachable, dataset not ready, or launch feed temporarily down — nothing is charged.
- status: 504
  title: Analysis timed out
  detail: The free scanner's analysis exceeded its time budget.
- status: 202
  title: Payment not yet confirmed (not an error)
  detail: POST /v1/keys before the SOL payment confirms — retry shortly.
